<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Bạn có thư nè</title>
    <style>
        body {
            background-image: url('background.jpg'); /* Đường dẫn đến file hình nền */
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="envelope-container">
        <div class="envelope">
            <div class="envelope__tab"></div>
            <div class="envelope__letter">
                <p>Từ khi Ha xuất hiện, cuộc sống của anh có thêm nhiều màu sắc hơn💫 Mong là Ha cũng cảm nhận được điều đó, luôn có 1 ngày thật vui nha <333 💖</p>
            </div>
            <div class="envelope--base"></div> 
        </div>
    </div>

    <div class="truck-container">
        <div class="container">
            <div class="ts">
                <div class="box"></div>
                <div class="front">
                    <div class="light"></div>
                    <div class="trapezoid"></div>
                    <div class="pipe"></div>
                    <div class="pipe2"></div>
                    <img class="img1" src="https://i.gifer.com/5zoP.gif">
                    <img class="img2" src="https://i.gifer.com/5zoP.gif">
                    <img class="img3" src="https://i.gifer.com/5zoP.gif">
                    <img class="img4" src="https://i.gifer.com/5zoP.gif">
                    <img class="img5" src="https://i.gifer.com/5zoP.gif">
                    <img class="img6" src="https://i.gifer.com/5zoP.gif">
                    <img class="img7" src="https://i.gifer.com/5zoP.gif">
                    <img class="img8" src="https://i.gifer.com/5zoP.gif">
                    <img class="img9" src="https://i.gifer.com/5zoP.gif">
                    <img class="img10" src="https://i.gifer.com/5zoP.gif">
                    <img class="img11" src="https://i.gifer.com/5zoP.gif">
                    <div class="front1"></div>
                    <div class="front2"></div>
                    <div class="window"></div>
                    <div class="hood"></div>    
                </div>
                <div class="tyre1">
                    <div class="r1"></div>
                    <div class="r2"></div>
                    <div class="r3"></div>
                    <div class="r4"></div>
                    <div class="r5"></div>
                    <div class="r6"></div>
                </div>
                <div class="tyre2">
                    <div class="r1"></div>
                    <div class="r2"></div>
                    <div class="r3"></div>
                    <div class="r4"></div>
                    <div class="r5"></div>
                    <div class="r6"></div>
                </div>
                <div class="tyre3">
                    <div class="r1"></div>
                    <div class="r2"></div>
                    <div class="r3"></div>
                    <div class="r4"></div>
                    <div class="r5"></div>
                    <div class="r6"></div>
                </div>
                <div class="tyre4">
                    <div class="r1"></div>
                    <div class="r2"></div>
                    <div class="r3"></div>
                    <div class="r4"></div>
                    <div class="r5"></div>
                    <div class="r6"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhạc nền -->
    <button onclick="document.getElementById('my-audio').play()">Phát nhạc</button>
<audio id="my-audio" src="nhacnen.mp3"></audio>
    <audio autoplay loop>
        <source src="nhacnen.mp3" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ phát nhạc.
    </audio>
</body>
</html>
